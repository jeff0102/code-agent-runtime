[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-runtime"
version = "0.1.0"
description = "Persistent orchestration runtime for autonomous Supervisor/Executor coding agents."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
code-agent-runtime = "runtime.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
agents = [
    "openhands-sdk>=1.51,<1.52; python_version >= '3.12'",
    "openhands-tools>=1.51,<1.52; python_version >= '3.12'",
]

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
