services:
  # ----------------------------------------------------------------------------
  # LiteLLM Proxy: Manages API rate-limits, fallbacks, and model routing
  # ----------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: --config /app/config.yaml --port 4000
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # OpenHands: Autonomous software development agent
  # ----------------------------------------------------------------------------
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands-app
    depends_on:
      - litellm
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_USER_ID=1000
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_PATH}
      - LLM_MODEL=openai/gemini-primary
      - LLM_BASE_URL=http://litellm:4000/v1
      - LLM_API_KEY=sk-dummy
      - HEROKU_API_KEY=${HEROKU_API_KEY:-}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL:-}
    volumes:
      - ${WORKSPACE_PATH}:/opt/workspace_base
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped