# LiteLLM Proxy configuration: Handles automatic failovers when rate limits (HTTP 429) occur.
model_list:
  # Primary model: Cost-effective reasoning and execution
  - model_name: gemini-primary
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "${GEMINI_API_KEY}"

  # Fallback model: Activated automatically if Gemini exhausts its quota
  - model_name: groq-backup
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "${GROQ_API_KEY}"

router_settings:
  # Fallback routing table
  fallbacks:
    - gemini-primary: ["groq-backup"]

  # Cooldown period in seconds before attempting to route back to the primary model
  cooldown_time: 60

  # Number of failed attempts before triggering fallback
  allowed_fails: 1